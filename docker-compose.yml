
services:
  backend:
    build:
      context: ./backend
    container_name: release-checklist-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/graphql
    container_name: release-checklist-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
